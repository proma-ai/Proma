# GitHub Actions: 自动打包并上传到阿里云 OSS
#
# 触发条件：推送 v* tag（如 v0.4.0）
# 构建 macOS（arm64 + x64）和 Windows（x64）产物，上传到 OSS
#
# 所需 GitHub Secrets:
#
# OSS 上传:
# - OSS_ACCESS_KEY_ID: 阿里云 AccessKey ID
# - OSS_ACCESS_KEY_SECRET: 阿里云 AccessKey Secret
# - OSS_REGION: OSS 区域（如 oss-cn-hangzhou）
# - OSS_RELEASES_BUCKET: 生产 Bucket 名称
#
# macOS 签名/公证:
# - MAC_CERTS: Base64 编码的 macOS Developer ID Application 证书 (.p12)
# - MAC_CERTS_PASSWORD: 证书密码
# - APPLE_ID: Apple ID（公证用）
# - APPLE_APP_SPECIFIC_PASSWORD: App-Specific 密码（公证用）
# - APPLE_TEAM_ID: Apple Developer Team ID

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            vendor_platforms: "--platform darwin-arm64 --platform darwin-x64"
          - os: windows-latest
            platform: win
            vendor_platforms: "--platform win32-x64"

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 缓存 Bun 依赖
      - name: 缓存 Bun 依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 安装依赖
        run: bun install

      - name: 下载 Bun 二进制
        run: bun run scripts/download-bun.ts ${{ matrix.vendor_platforms }}
        working-directory: apps/electron

      # macOS 代码签名准备
      - name: 导入 macOS 签名证书
        if: matrix.platform == 'mac'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      # 构建应用
      - name: 构建 Electron 应用
        run: bun run electron:build

      # 打包（不发布到 GitHub Releases）
      - name: 打包 (macOS)
        if: matrix.platform == 'mac'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never
        working-directory: apps/electron

      - name: 打包 (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never
        working-directory: apps/electron

      # 上传到阿里云 OSS
      - name: 上传到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_RELEASES_BUCKET: ${{ secrets.OSS_RELEASES_BUCKET }}
        run: bun run upload:release
        working-directory: apps/electron

      # 上传产物到 GitHub Artifacts（备份，保留 7 天）
      - name: 上传构建产物备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            apps/electron/out/*.dmg
            apps/electron/out/*.zip
            apps/electron/out/*.exe
            apps/electron/out/*.yml
          retention-days: 1
          if-no-files-found: warn
