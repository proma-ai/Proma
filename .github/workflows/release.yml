# GitHub Actions: 自动打包并上传到阿里云 OSS
#
# 触发条件：推送 v* tag（如 v0.4.0）
# 构建 macOS（arm64 + x64）、Windows（x64）与 Linux（x64）产物，上传到 OSS
#
# 所需 GitHub Secrets:
#
# OSS 上传:
# - OSS_ACCESS_KEY_ID: 阿里云 AccessKey ID
# - OSS_ACCESS_KEY_SECRET: 阿里云 AccessKey Secret
# - OSS_REGION: OSS 区域（如 oss-cn-hangzhou）
# - OSS_RELEASES_BUCKET: 生产 Bucket 名称
#
# macOS 签名/公证:
# - MAC_CERTS: Base64 编码的 macOS Developer ID Application 证书 (.p12)
# - MAC_CERTS_PASSWORD: 证书密码
# - APPLE_ID: Apple ID（公证用）
# - APPLE_APP_SPECIFIC_PASSWORD: App-Specific 密码（公证用）
# - APPLE_TEAM_ID: Apple Developer Team ID

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac-arm64:
    name: build (macos-latest, mac, arm64, --arm64)
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 缓存 Bun 依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

# 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（macOS arm64）
        run: bun run --filter='@proma/electron' prepare:officecli

      # macOS 代码签名准备
      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      - name: 构建 Electron 应用
        run: bun run electron:build

      - name: 同步 Electron 运行时依赖
        run: bun run sync:runtime-deps
        working-directory: apps/electron

      - name: 重建 macOS arm64 node-pty 原生依赖
        run: bun run rebuild:node-pty
        working-directory: apps/electron

      - name: 打包 (macOS arm64)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for i in 1 2 3; do
            if bunx electron-builder@25.1.8 --mac --arm64 --publish never; then
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done

          echo "macOS ARM64 packaging failed after 3 attempts"
          exit 1
        working-directory: apps/electron

      # sync:runtime-deps 会清空 apps/electron/node_modules 以形成最小打包闭包；
      # upload-release.ts 的 ali-oss 是发布工具依赖，上传前须恢复 workspace 依赖。
      - name: 恢复 OSS 上传工具依赖
        run: bun install --frozen-lockfile

      - name: 上传到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_RELEASES_BUCKET: ${{ secrets.OSS_RELEASES_BUCKET }}
        run: bun run upload:release
        working-directory: apps/electron

      - name: 上传构建产物备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mac-arm64
          path: |
            apps/electron/out/*.dmg
            apps/electron/out/*.zip
            apps/electron/out/*.blockmap
            apps/electron/out/*.yml
          retention-days: 1
          if-no-files-found: warn

  build-mac-x64:
    name: build (macos-15-intel, mac, x64, --x64)
    runs-on: macos-15-intel

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 缓存 Bun 依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

# 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（macOS x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      # macOS 代码签名准备
      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      - name: 构建 Electron 应用
        run: bun run electron:build

      - name: 同步 Electron 运行时依赖
        run: bun run sync:runtime-deps
        working-directory: apps/electron

      - name: 重建 macOS x64 node-pty 原生依赖
        run: bun run rebuild:node-pty
        working-directory: apps/electron

      - name: 打包 (macOS x64)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for i in 1 2 3; do
            if bunx electron-builder@25.1.8 --mac --x64 --publish never; then
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 15s..."
              sleep 15
            fi
          done

          echo "macOS x64 packaging failed after 3 attempts"
          exit 1
        working-directory: apps/electron

      # sync:runtime-deps 会清空 apps/electron/node_modules 以形成最小打包闭包；
      # upload-release.ts 的 ali-oss 是发布工具依赖，上传前须恢复 workspace 依赖。
      - name: 恢复 OSS 上传工具依赖
        run: bun install --frozen-lockfile

      - name: 上传到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_RELEASES_BUCKET: ${{ secrets.OSS_RELEASES_BUCKET }}
        run: bun run upload:release
        working-directory: apps/electron

      - name: 上传构建产物备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mac-x64
          path: |
            apps/electron/out/*.dmg
            apps/electron/out/*.zip
            apps/electron/out/*.blockmap
            apps/electron/out/*.yml
          retention-days: 1
          if-no-files-found: warn

  build-linux-x64:
    name: build (ubuntu-22.04, linux, x64, --x64)
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 缓存 Bun 依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential desktop-file-utils python3

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 准备 OfficeCLI（Linux x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: 构建 Electron 应用
        run: bun run electron:build

      - name: 同步 Electron 运行时依赖
        run: bun run sync:runtime-deps
        working-directory: apps/electron

      - name: 重建 Linux node-pty 原生依赖
        run: bun run rebuild:node-pty
        working-directory: apps/electron

      - name: 打包（Linux x64）
        run: bunx electron-builder@25.1.8 --linux --x64 --publish never
        working-directory: apps/electron

      - name: 验证 Linux OAuth deep-link 元数据
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="apps/electron/out"
          deb="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          appimage="$(readlink -f "$appimage")"

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          deb_desktop="$tmpdir/proma.deb.desktop"
          dpkg-deb --fsys-tarfile "$deb" | tar -xOf - ./usr/share/applications/proma.desktop > "$deb_desktop"

          appimage_dir="$tmpdir/appimage"
          mkdir "$appimage_dir"
          (
            cd "$appimage_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          appimage_desktop="$(find "$appimage_dir/squashfs-root" -type f -name '*.desktop' -print -quit)"
          test -n "$appimage_desktop"

          for desktop in "$deb_desktop" "$appimage_desktop"; do
            desktop-file-validate "$desktop"
            grep -Fq 'x-scheme-handler/proma;' "$desktop"
            grep -Eq '^Exec=.*%U$' "$desktop"
          done

      # sync:runtime-deps 会清空 apps/electron/node_modules 以形成最小打包闭包；
      # upload-release.ts 的 ali-oss 是发布工具依赖，上传前须恢复 workspace 依赖。
      - name: 恢复 OSS 上传工具依赖
        run: bun install --frozen-lockfile

      - name: 上传到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_RELEASES_BUCKET: ${{ secrets.OSS_RELEASES_BUCKET }}
        run: bun run upload:release
        working-directory: apps/electron

      - name: 上传构建产物备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            apps/electron/out/*.AppImage
            apps/electron/out/*.deb
            apps/electron/out/*.blockmap
            apps/electron/out/latest-linux.yml
          retention-days: 1
          if-no-files-found: warn

  build-windows-x64:
    name: build (windows-latest, win, x64, --x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 缓存 Bun 依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

# 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（Windows x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: 构建 Electron 应用
        run: bun run electron:build

      - name: 同步 Electron 运行时依赖
        run: bun run sync:runtime-deps
        working-directory: apps/electron

      - name: 重建 Windows node-pty 原生依赖
        run: bun run rebuild:node-pty
        working-directory: apps/electron

      - name: 打包 (Windows x64)
        run: bunx electron-builder@25.1.8 --win --x64 --publish never
        working-directory: apps/electron

      - name: 校验 Windows Sharp 原生依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resources = Join-Path $PWD 'apps/electron/out/win-unpacked/resources'
          $unpacked = Join-Path $resources 'app.asar.unpacked/node_modules'
          $img = Join-Path $unpacked '@img'
          $winSharp = Join-Path $img 'sharp-win32-x64'

          if (!(Test-Path (Join-Path $resources 'app.asar'))) { throw 'Missing resources/app.asar' }
          if (!(Test-Path (Join-Path $unpacked 'sharp/package.json'))) { throw 'Missing unpacked sharp package' }
          if (!(Test-Path (Join-Path $winSharp 'package.json'))) { throw 'Missing @img/sharp-win32-x64' }

          $native = Get-ChildItem (Join-Path $winSharp 'lib') -Filter '*.node' -File -ErrorAction SilentlyContinue
          if ($native.Count -lt 1) { throw 'No Windows sharp native .node binary found' }

          $darwin = Get-ChildItem $img -Directory -Force | Where-Object { $_.Name -match '^sharp(-libvips)?-darwin-' }
          if ($darwin) { throw "Darwin Sharp packages were bundled: $($darwin.FullName -join ', ')" }

          $env:NODE_PATH = $unpacked
          node -e "const sharp=require('sharp'); console.log('sharp loaded:', sharp.versions.sharp)"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Sharp failed to load on Windows' }
          Remove-Item Env:NODE_PATH

      # sync:runtime-deps 会清空 apps/electron/node_modules 以形成最小打包闭包；
      # upload-release.ts 的 ali-oss 是发布工具依赖，上传前须恢复 workspace 依赖。
      - name: 恢复 OSS 上传工具依赖
        run: bun install --frozen-lockfile

      - name: 上传到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_RELEASES_BUCKET: ${{ secrets.OSS_RELEASES_BUCKET }}
        run: bun run upload:release
        working-directory: apps/electron

      - name: 上传构建产物备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            apps/electron/out/*.exe
            apps/electron/out/*.blockmap
            apps/electron/out/*.yml
          retention-days: 1
          if-no-files-found: warn
