name: macOS ARM64 EventKit Test Build

on:
  # 仅为当前签名验证分支自动运行；不会影响 main 或其他功能分支。
  push:
    branches:
      - feat-macos-eventkit-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Signed macOS ARM64 test package
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 与 release.yml 保持同一证书导入方式。该 workflow 只上传私有 Actions artifact，绝不发布 Release。
      - name: Import Developer ID certificate
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build application
        run: bun run electron:build

      - name: Package signed ARM64 macOS app
        working-directory: apps/electron
        env:
          # 可选公证：有 release secrets 时 electron-builder 自动使用；没有时仍产出已签名测试包。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bunx electron-builder --mac --arm64 --publish never

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Proma-EventKit-macOS-arm64
          path: |
            apps/electron/out/*.dmg
            apps/electron/out/*.zip
          if-no-files-found: error
          retention-days: 7
