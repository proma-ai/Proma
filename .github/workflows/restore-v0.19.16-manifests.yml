name: Restore v0.19.16 update manifests

on:
  workflow_dispatch:

jobs:
  restore-manifests:
    name: restore auto-update manifests only
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout v0.19.16 release tooling
        uses: actions/checkout@v4
        with:
          ref: v0.19.16

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # This installs the small OSS client dependency only. It deliberately does
      # not call any Electron build, package, signing, or release command.
      - name: Install upload tooling
        run: bun install --frozen-lockfile

      - name: Download v0.19.16 manifest backups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p restore/manifests
          gh run download 33517417977 --repo ErlichLiu/PromaCommercial --name release-mac-arm64 --dir restore/manifests/mac-arm64
          gh run download 33517417977 --repo ErlichLiu/PromaCommercial --name release-linux-x64 --dir restore/manifests/linux-x64
          gh run download 33517417977 --repo ErlichLiu/PromaCommercial --name release-windows-x64 --dir restore/manifests/win-x64
          grep -q '^version: 0\.19\.16$' restore/manifests/mac-arm64/latest-mac.yml
          grep -q '^version: 0\.19\.16$' restore/manifests/linux-x64/latest-linux.yml
          grep -q '^version: 0\.19\.16$' restore/manifests/win-x64/latest.yml

      - name: Restore production auto-update manifests
        working-directory: apps/electron
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_RELEASES_BUCKET: ${{ secrets.OSS_RELEASES_BUCKET }}
        run: |
          bun -e '
            import OSS from "ali-oss"
            import fs from "node:fs"
            import path from "node:path"

            const root = path.resolve("../..", "restore/manifests")
            const items = [
              ["mac-arm64", "latest-mac.yml"],
              ["linux-x64", "latest-linux.yml"],
              ["win-x64", "latest.yml"],
            ]
            const client = new OSS({
              accessKeyId: process.env.OSS_ACCESS_KEY_ID,
              accessKeySecret: process.env.OSS_ACCESS_KEY_SECRET,
              bucket: process.env.OSS_RELEASES_BUCKET,
              region: process.env.OSS_REGION,
            })
            for (const [platform, file] of items) {
              const local = path.join(root, platform, file)
              const contents = fs.readFileSync(local, "utf8")
              if (!/^version: 0\.19\.16$/m.test(contents)) throw new Error(`Unexpected manifest version in ${local}`)
              const target = `releases/${platform}/${file}`
              await client.put(target, local, { headers: { "Content-Type": "text/yaml" } })
              const remote = await client.get(target)
              if (remote.content.toString() !== contents) throw new Error(`Manifest verification failed: ${target}`)
              console.log(`Restored ${target} to v0.19.16`)
            }
          '
