<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Proma 标志 - 纯白无背景版（从官方 icon.svg 按 800→120 等比缩放提取条纹图案，去掉黑色圆角背景） -->
  <!-- 每根条纹间距约为其宽度的 33%，与官方图标一致，避免黏连 -->

  <!-- 第一层 - 最近，最实 -->
  <rect x="22.5" y="52.5" width="13.5" height="60" rx="2.25" fill="#FFFFFF" opacity="1"/>

  <!-- 第二层 - 渐远 -->
  <rect x="40.5" y="48" width="12" height="54" rx="2" fill="#F0F0F0" opacity="0.85"
        transform="rotate(-3 46.5 75)"/>

  <!-- 第三层 - 更远 -->
  <rect x="57" y="43.5" width="10.5" height="48" rx="1.65" fill="#E0E0E0" opacity="0.7"
        transform="rotate(-6 62.25 67.5)"/>

  <!-- 第四层 - 渐隐 -->
  <rect x="72" y="39" width="9" height="42" rx="1.35" fill="#D0D0D0" opacity="0.55"
        transform="rotate(-9 76.5 60)"/>

  <!-- 第五层 - 远端 -->
  <rect x="85.5" y="34.5" width="7.5" height="36" rx="1.05" fill="#C0C0C0" opacity="0.4"
        transform="rotate(-12 89.25 52.5)"/>

  <!-- 第六层 - 几乎消失 -->
  <rect x="97.5" y="30" width="6" height="30" rx="0.9" fill="#B0B0B0" opacity="0.25"
        transform="rotate(-15 100.5 45)"/>
</svg>
